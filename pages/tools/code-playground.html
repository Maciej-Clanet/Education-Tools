<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Playground | Education Tools</title>
    <meta
      name="description"
      content="A static HTML, CSS, and JavaScript playground for web development lessons and independent practice."
    />
    <meta property="og:title" content="Code Playground | Education Tools" />
    <meta
      property="og:description"
      content="Practise HTML, CSS, and JavaScript in a larger classroom-friendly coding workspace."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Education Tools" />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary" />
    <link rel="stylesheet" href="../../css/base.css" />
    <link rel="stylesheet" href="../../css/components.css" />
    <link rel="stylesheet" href="../../css/theme.css" />
    <link rel="stylesheet" href="../../css/live-code-example.css?v=20260904-7" />
    <link rel="stylesheet" href="../../css/pages/code-playground.css" />
    <link rel="stylesheet" href="../../css/accessibility.css" />
    <script type="module" src="../../javascript/accessibility.js"></script>
    <script type="module" src="../../javascript/pages/code-playground.js?v=20260904-7"></script>
  </head>
  <body>
    <div class="page-shell playground-shell">
      <header class="playground-header panel panel-accent">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <ol class="breadcrumb-list">
            <li><a href="../../index.html">Home</a></li>
            <li>
              <a href="../resources/web-development.html">Web Development</a>
            </li>
            <li aria-current="page">Code Playground</li>
          </ol>
        </nav>

        <div class="playground-header__grid">
          <div>
            <p class="eyebrow">Web Development Tool</p>
            <h1>Code Playground</h1>
            <p class="playground-header__copy" data-role="playground-context">
              Choose a workspace type and keep experimenting.
            </p>
          </div>

          <div class="playground-controls" aria-label="Playground controls">
            <div class="playground-mode" aria-label="Workspace type">
              <button
                type="button"
                class="playground-mode__button is-active"
                data-playground-mode="html-css"
                aria-pressed="true"
              >
                HTML / CSS
              </button>
              <button
                type="button"
                class="playground-mode__button"
                data-playground-mode="javascript"
                aria-pressed="false"
              >
                JavaScript Console
              </button>
            </div>

            <div class="playground-actions">
              <button
                type="button"
                class="lesson-secondary-action"
                data-action="reset-view"
              >
                Reset view
              </button>
              <button
                type="button"
                class="lesson-secondary-action"
                data-action="reset-workspace"
              >
                Reset workspace
              </button>
              <p class="playground-save-status" data-role="save-status">
                Ready
              </p>
            </div>
          </div>
        </div>
      </header>

      <main class="playground-main">
        <div data-role="playground-mount"></div>
      </main>

      <noscript>
        <section class="panel playground-noscript">
          <h2>JavaScript is needed</h2>
          <p>
            The playground editor, preview, console, and local saving need
            JavaScript in this browser.
          </p>
        </section>
      </noscript>
    </div>
  </body>
</html>
