<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unit 2 Question Bank Review | Education Tools</title>
    <meta
      name="description"
      content="Hidden authoring review page for Unit 2 exam-practice questions and mark schemes."
    />
    <meta name="robots" content="noindex,nofollow" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta http-equiv="Pragma" content="no-cache" />
    <link rel="stylesheet" href="../../css/base.css" />
    <link rel="stylesheet" href="../../css/components.css" />
    <link rel="stylesheet" href="../../css/theme.css" />
    <link rel="stylesheet" href="../../css/pages/past-exam.css" />
    <script
      type="module"
      src="../../javascript/pages/btec-level-3-unit-2-question-bank-review.js?v=unit2-bank-review-20260518"
    ></script>
  </head>
  <body>
    <div class="page-shell exam-shell question-review-shell">
      <header class="exam-hero panel panel-accent">
        <p class="eyebrow">Hidden Authoring Review</p>
        <h1>Unit 2 question bank review</h1>
        <p class="exam-hero-text">
          Check question wording, scenario grouping, metadata, response shape,
          and mark scheme data before questions are used in practice papers.
        </p>
        <div class="exam-meta-grid" data-role="review-summary"></div>
      </header>

      <section
        class="panel question-review-controls"
        aria-labelledby="question-review-controls-heading"
      >
        <div>
          <p class="eyebrow">Review Filters</p>
          <h2 id="question-review-controls-heading">Find questions to check</h2>
        </div>
        <label>
          <span>Search</span>
          <input
            type="search"
            data-role="review-search"
            placeholder="Question ID, keyword, topic, or mark scheme text"
          />
        </label>
        <label>
          <span>Topic</span>
          <select data-role="review-topic-filter"></select>
        </label>
        <label>
          <span>Source</span>
          <select data-role="review-source-filter"></select>
        </label>
      </section>

      <main
        class="question-review-list"
        data-role="question-review-list"
        aria-live="polite"
      ></main>
    </div>
  </body>
</html>
