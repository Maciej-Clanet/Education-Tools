<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 490" role="img" aria-labelledby="title desc">
  <title id="title">Inside a NAS: the drives are only part of the computer</title>
  <desc id="desc">Four drive trays connect to a circuit board containing a processor, RAM and network interface electronics. The interface connects to a separate Ethernet socket in the rear panel. A fan removes heat.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#263f4b;font-size:20px}.head{font-weight:700;font-size:22px}.wire{fill:none;stroke:#688c99;stroke-width:3}.label{fill:#fffdf7;stroke:#a4b8bf;stroke-width:1.5}</style>
  <rect x="5" y="5" width="1110" height="480" rx="18" fill="#f6f8f5"/>
  <rect x="215" y="86" width="680" height="319" rx="25" fill="#e1e9eb" stroke="#567582" stroke-width="3"/>
  <path d="M847 87v317" stroke="#9fb1b8" stroke-width="3"/>
  <text x="242" y="118" style="font-size:17px">Conceptual cutaway · parts vary by model</text>
  <g fill="#f7fafb" stroke="#6e8995" stroke-width="2">
    <rect x="248" y="149" width="58" height="200" rx="8"/><rect x="316" y="149" width="58" height="200" rx="8"/><rect x="384" y="149" width="58" height="200" rx="8"/><rect x="452" y="149" width="58" height="200" rx="8"/>
  </g>
  <g fill="#dde8ec" stroke="#547686" stroke-width="2"><circle cx="277" cy="228" r="19"/><circle cx="345" cy="228" r="19"/><circle cx="413" cy="228" r="19"/><circle cx="481" cy="228" r="19"/></g>
  <g fill="#365d71"><rect x="260" y="303" width="33" height="9" rx="3"/><rect x="328" y="303" width="33" height="9" rx="3"/><rect x="396" y="303" width="33" height="9" rx="3"/><rect x="464" y="303" width="33" height="9" rx="3"/></g>
  <text x="277" y="181" text-anchor="middle">1</text><text x="345" y="181" text-anchor="middle">2</text><text x="413" y="181" text-anchor="middle">3</text><text x="481" y="181" text-anchor="middle">4</text>
  <rect x="548" y="148" width="273" height="220" rx="9" fill="#d2e4d8" stroke="#769d84" stroke-width="2"/>
  <path d="M510 320h38m0-127h44m63 20h32v82h56m-88-42h66v79" fill="none" stroke="#8bab94" stroke-width="4"/>
  <rect x="583" y="185" width="83" height="73" rx="4" fill="#e4bf74" stroke="#8c723a" stroke-width="2"/><text x="624" y="229" text-anchor="middle" class="head">CPU</text>
  <rect x="573" y="295" width="143" height="35" rx="3" fill="#50775e"/><text x="644" y="320" text-anchor="middle" style="fill:white">RAM</text>
  <rect x="744" y="290" width="53" height="47" rx="3" fill="#95bdce" stroke="#466f83" stroke-width="2"/><text x="770" y="320" text-anchor="middle" style="font-size:16px">NIC</text>
  <path d="M797 314h58" stroke="#366881" stroke-width="5"/>
  <rect x="856" y="295" width="34" height="34" rx="3" fill="#223f50"/><path d="M862 301h22v17h-6v5h-10v-5h-6z" fill="#a6bbc3"/>
  <path d="M891 312h28v52h25" fill="none" stroke="#d29d3e" stroke-width="7"/>
  <circle cx="775" cy="215" r="39" fill="#f6fafb" stroke="#607d89" stroke-width="3"/>
  <path d="M775 186c20 0 28 30 0 29m29 0c0 20-29 29-29 0m0 29c-20 0-29-29 0-29m-29 0c0-20 29-29 29 0" fill="#9eb3bc"/><circle cx="775" cy="215" r="7" fill="#476b7c"/>
