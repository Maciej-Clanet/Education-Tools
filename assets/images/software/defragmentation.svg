<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" role="img" aria-labelledby="title desc">
<title id="title">HDD defragmentation</title><desc id="desc">Before: A1, B1, A2, free, B2, A3, free, free. After: A1, A2, A3, B1, B2, free, free, free. The labels show fragments of files A and B.</desc>
