<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 290" role="img" aria-labelledby="title desc">
<title id="title">Encryption and decryption</title><desc id="desc">Readable coursework passes through encryption with a key to become ciphertext. Decryption with the correct key restores readable data.</desc>
<g stroke="#294c50" stroke-width="3"><rect x="20" y="60" width="220" height="125" rx="9" fill="#fffdf8"/><rect x="315" y="60" width="210" height="125" rx="9" fill="#dcefe8"/><rect x="600" y="60" width="220" height="125" rx="9" fill="#e4f1f7"/><path d="M250 119h53l-11-8m11 8-11 8M535 119h53l-11-8m11 8-11 8M710 198v49H130v-48l-8 11m8-11 8 11" fill="none"/></g>
<g font-family="sans-serif" font-size="20" fill="#253442" text-anchor="middle"><text x="130" y="105" font-weight="700">Readable data</text><text x="130" y="145">My coursework…</text><text x="420" y="105">Encryption</text><text x="420" y="145">+ key</text><text x="710" y="105" font-weight="700">Ciphertext</text><text x="710" y="145" font-family="monospace">8f2a…c71b</text><text x="420" y="233">Decryption + correct key</text><text x="710" y="36" font-size="16">Illustrative encrypted bytes</text></g></svg>
