<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" role="img" aria-labelledby="title desc">
<title id="title">Backup and restore</title><desc id="desc">An original coursework folder is copied by a backup utility to a separate destination. A restore path can recover a saved copy after loss.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="#294c50"/></marker></defs>
<g stroke="#294c50" stroke-width="3"><path d="M25 80V59h92l23 21h96v123H25z" fill="#f2dc9e"/><rect x="315" y="80" width="204" height="122" rx="12" fill="#dcefe8"/><rect x="600" y="59" width="213" height="144" rx="12" fill="#e4f1f7"/><path d="M245 136h58m228 0h55" marker-end="url(#arrow)" fill="none"/><path d="M707 213v48H130v-47" marker-end="url(#arrow)" fill="none"/></g>
<g font-family="sans-serif" font-size="20" fill="#253442" text-anchor="middle"><text x="130" y="123" font-weight="700">Original data</text><text x="130" y="157">Coursework</text><text x="417" y="122" font-weight="700">Backup utility</text><text x="417" y="158">Scheduled copy</text><text x="706" y="116" font-weight="700">Separate copy</text><text x="706" y="153">Backup destination</text><text x="420" y="246">Restore saved data after loss</text></g></svg>
