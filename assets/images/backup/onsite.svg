<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240"><title>Live data and onsite backup share a building risk</title><rect width="720" height="240" rx="18" fill="#fffdf7"/><path d="M45 70 360 18 675 70v147H45Z" fill="#f5e4bd" stroke="#87611f" stroke-width="3"/><text x="360" y="66" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#24313b">College · same physical site</text><g fill="#e0f1ed" stroke="#155f64" stroke-width="3"><rect x="90" y="94" width="210" height="88" rx="10"/><rect x="420" y="94" width="210" height="88" rx="10"/></g><g fill="#24313b" font-family="sans-serif" font-size="23" text-anchor="middle"><text x="195" y="132">Live records</text><text x="195" y="162">Server</text><text x="525" y="132">Backup copy</text><text x="525" y="162">Separate device</text></g><path d="M318 137h80m-12-10 12 10-12 10" stroke="#155f64" stroke-width="4" fill="none"/><text x="360" y="207" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#87611f">A site-wide fire or flood may affect both.</text></svg>
