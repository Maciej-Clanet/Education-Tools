<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title description">
  <title id="title">The score variable stores the value 10</title>
  <desc id="description">An open box drawn in angled perspective. A card showing 10 sits inside, and a label reading score is attached to the front side.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#24313b" flood-opacity=".2" />
    </filter>
    <filter id="small-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#17262e" flood-opacity=".28" />
    </filter>
    <linearGradient id="left-face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef9f68" />
      <stop offset="1" stop-color="#d8784e" />
    </linearGradient>
    <linearGradient id="front-face" x1="0" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#ffd878" />
      <stop offset="1" stop-color="#e9ae45" />
    </linearGradient>
    <linearGradient id="number-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#e8f6ff" />
    </linearGradient>
  </defs>

  <path d="M116 437c43-40 141-57 291-51 166 6 274 37 292 79-47 31-151 45-311 40-148-4-239-27-272-68Z" fill="#24313b" opacity=".13" />

  <g filter="url(#shadow)" stroke="#24313b" stroke-width="7" stroke-linejoin="round">
    <path d="m188 205 257-101-55-74-260 92Z" fill="#ffe8a7" />
    <path d="m445 104 225 126 69-61L510 42Z" fill="#b9e5f4" />
    <path d="m188 205 217 130-84 54-217-136Z" fill="#cce9bd" />
    <path d="m188 205 257-101 225 126-265 105Z" fill="#173f4b" />
    <path d="m218 207 225-87 183 103-220 87Z" fill="#0d2b34" stroke-width="5" />
  </g>

  <g filter="url(#small-shadow)" transform="rotate(-7 428 213)">
    <rect x="345" y="116" width="170" height="181" rx="25" fill="url(#number-card)" stroke="#24313b" stroke-width="7" />
    <path d="M371 144h118" stroke="#69c8e8" stroke-width="9" stroke-linecap="round" />
    <text x="430" y="242" fill="#195e73" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="900" text-anchor="middle">10</text>
    <circle cx="378" cy="271" r="7" fill="#f2bf5e" />
    <circle cx="402" cy="271" r="7" fill="#8bcf88" />
  </g>

  <g filter="url(#shadow)" stroke="#24313b" stroke-width="7" stroke-linejoin="round">
    <path d="m188 205 217 130-8 143-217-134Z" fill="url(#left-face)" />
    <path d="m405 335 265-105-8 155-265 93Z" fill="url(#front-face)" />
    <path d="m188 205 217 130-24 17-215-130Z" fill="#f5b17e" stroke-width="5" />
    <path d="m405 335 265-105-25-15-264 104Z" fill="#ffe59d" stroke-width="5" />
  </g>

  <g transform="rotate(-18 533 358)" filter="url(#small-shadow)">
    <rect x="452" y="319" width="164" height="78" rx="13" fill="#fffdf8" stroke="#24313b" stroke-width="6" />
    <circle cx="470" cy="358" r="7" fill="#f2bf5e" stroke="#24313b" stroke-width="3" />
    <text x="535" y="357" fill="#195e73" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900" text-anchor="middle">score</text>
    <text x="535" y="380" fill="#4e616a" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" text-anchor="middle">VARIABLE NAME</text>
  </g>

  <path d="M610 105c32 4 53 20 62 47" fill="none" stroke="#c9713d" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 14" />
  <path d="m666 140 8 17-18-5" fill="#c9713d" />
  <path d="M132 72c14-17 33-27 57-28" fill="none" stroke="#1f7189" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 14" />
  <circle cx="113" cy="91" r="9" fill="#a58bd8" />
  <path d="m693 426 9 19 20 2-15 14 4 20-18-10-18 10 4-20-15-14 20-2Z" fill="#8bcf88" stroke="#24313b" stroke-width="4" stroke-linejoin="round" />
</svg>
